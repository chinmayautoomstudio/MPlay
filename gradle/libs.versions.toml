[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
materialIcons = "1.7.8"
coil = "3.6.3"
coroutines = "1.11.0"
media3 = "1.11.1"
datastore = "1.2.1"
junit = "4.13.2"
mockito = "5.20.0"
